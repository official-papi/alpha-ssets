name: Automatic Payout Cron Engine

on:
  schedule:
    # Runs automatically on GitHub servers every 5 minutes (FREE)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-payouts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Payouts Engine API
        run: |
          curl -s -X POST https://alpha-assets.vercel.app/api/cron/payouts || true
